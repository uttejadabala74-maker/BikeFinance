<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer - Sri Sai Teja Finance</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand-title">🏍️ Sri Sai Teja</div>
            <div class="sidebar-brand-subtitle">Finance & Auto Consultancy</div>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
            <a href="/bikes" class="nav-item"><span class="nav-icon">🛵</span> Bikes Register</a>
            <a href="/customers" class="nav-item active"><span class="nav-icon">👥</span> Customers</a>
            <a href="/finance" class="nav-item"><span class="nav-icon">💰</span> Finance Accounts</a>
            <a href="/emis" class="nav-item"><span class="nav-icon">📅</span> EMI Schedule</a>
            <a href="/payments" class="nav-item"><span class="nav-icon">💵</span> Payments</a>
            <a href="/challans" class="nav-item"><span class="nav-icon">📜</span> Challans</a>
            <a href="/reports" class="nav-item"><span class="nav-icon">📈</span> Reports</a>
            <a href="/settings" class="nav-item"><span class="nav-icon">⚙️</span> Settings</a>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="top-header">
            <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
            <div class="header-actions">
                <div class="business-badge"><span>🏢</span> Sri Sai Teja Finance</div>
            </div>
        </header>

        <main class="content-area">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Add New Customer</h1>
                    <p class="page-subtitle">Enter customer details and contact info</p>
                </div>
                <a href="/customers" class="btn btn-outline">⬅️ Back to Customers</a>
            </div>

            <div class="card">
                <form th:action="@{/customers/save}" th:object="${customer}" method="post">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Dokka Sathya Krishna" required>
                        </div>
                        <div class="form-group">
                            <label>Phone Number *</label>
                            <input type="text" th:field="*{phone}" class="form-control" placeholder="10-digit mobile number" required>
                        </div>
                        <div class="form-group">
                            <label>Alternate Phone</label>
                            <input type="text" th:field="*{alternatePhone}" class="form-control" placeholder="Alternate mobile number">
                        </div>
                        <div class="form-group">
                            <label>Father / Husband / Guardian Name</label>
                            <input type="text" th:field="*{guardianName}" class="form-control" placeholder="Guardian name">
                        </div>
                        <div class="form-group">
                            <label>Address</label>
                            <input type="text" th:field="*{address}" class="form-control" placeholder="Street / House No">
                        </div>
                        <div class="form-group">
                            <label>Village / City</label>
                            <input type="text" th:field="*{cityVillage}" class="form-control" placeholder="City or Village">
                        </div>
                        <div class="form-group">
                            <label>District</label>
                            <input type="text" th:field="*{district}" class="form-control" placeholder="District name">
                        </div>
                        <div class="form-group">
                            <label>State</label>
                            <input type="text" th:field="*{state}" class="form-control" value="Andhra Pradesh">
                        </div>
                        <div class="form-group">
                            <label>Pincode</label>
                            <input type="text" th:field="*{pincode}" class="form-control" placeholder="6-digit Pincode">
                        </div>
                        <div class="form-group">
                            <label>Aadhaar / PAN / ID Proof Details</label>
                            <input type="text" th:field="*{idProofDetails}" class="form-control" placeholder="Aadhaar No / PAN No">
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Notes</label>
                            <textarea th:field="*{notes}" class="form-control" rows="3" placeholder="Additional details or remarks"></textarea>
                        </div>
                    </div>

                    <div style="margin-top: 24px; display: flex; gap: 12px;">
                        <button type="submit" class="btn btn-primary">💾 Save Customer</button>
                        <a href="/customers" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

</body>
</html>
