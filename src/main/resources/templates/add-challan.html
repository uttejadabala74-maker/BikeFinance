<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Challan - Sri Sai Teja Finance</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand-title">🏍️ Sri Sai Teja</div>
            <div class="sidebar-brand-subtitle">Finance & Auto Consultancy</div>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
            <a href="/bikes" class="nav-item"><span class="nav-icon">🛵</span> Bikes Register</a>
            <a href="/customers" class="nav-item"><span class="nav-icon">👥</span> Customers</a>
            <a href="/finance" class="nav-item"><span class="nav-icon">💰</span> Finance Accounts</a>
            <a href="/emis" class="nav-item"><span class="nav-icon">📅</span> EMI Schedule</a>
            <a href="/payments" class="nav-item"><span class="nav-icon">💵</span> Payments</a>
            <a href="/challans" class="nav-item active"><span class="nav-icon">📜</span> Challans</a>
            <a href="/reports" class="nav-item"><span class="nav-icon">📈</span> Reports</a>
            <a href="/settings" class="nav-item"><span class="nav-icon">⚙️</span> Settings</a>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="top-header">
            <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
            <div class="header-actions">
                <div class="business-badge"><span>🏢</span> Sri Sai Teja Finance</div>
            </div>
        </header>

        <main class="content-area">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Record Traffic Challan</h1>
                    <p class="page-subtitle">Attach fine details to vehicle registration</p>
                </div>
                <a href="/challans" class="btn btn-outline">⬅️ Back to Challans</a>
            </div>

            <div class="card" style="max-width: 700px; margin: 0 auto;">
                <form th:action="@{/challans/save}" th:object="${challan}" method="post">
                    <div class="form-grid" style="grid-template-columns: 1fr;">
                        <div class="form-group">
                            <label>Select Vehicle *</label>
                            <select name="bikeId" class="form-control" required>
                                <option value="">-- Choose Bike --</option>
                                <option th:each="b : ${bikes}" th:value="${b.bikeId}" th:text="${b.company + ' ' + b.model + ' (' + (b.registrationNumber != null ? b.registrationNumber : 'No Reg') + ')'}" th:selected="${challan.bike != null and challan.bike.bikeId == b.bikeId}"></option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Challan Number *</label>
                            <input type="text" th:field="*{challanNumber}" class="form-control" placeholder="e.g. AP123456789" required>
                        </div>

                        <div class="form-group">
                            <label>Challan Date *</label>
                            <input type="date" th:field="*{challanDate}" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label>Fine Amount (₹) *</label>
                            <input type="number" step="0.01" th:field="*{amount}" class="form-control" placeholder="1000" required>
                        </div>

                        <div class="form-group">
                            <label>Reason / Violation Description</label>
                            <input type="text" th:field="*{reason}" class="form-control" placeholder="e.g. Speeding, No Helmet, Signal Jump">
                        </div>

                        <div class="form-group">
                            <label>Offence Location</label>
                            <input type="text" th:field="*{location}" class="form-control" placeholder="City / Junction / Highway">
                        </div>

                        <div class="form-group">
                            <label>Challan Status</label>
                            <select th:field="*{status}" class="form-control">
                                <option value="Pending">Pending</option>
                                <option value="Paid">Paid</option>
                                <option value="Disputed">Disputed</option>
                            </select>
                        </div>
                    </div>

                    <div style="margin-top: 24px; display: flex; gap: 12px;">
                        <button type="submit" class="btn btn-primary">💾 Save Challan Record</button>
                        <a href="/challans" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

</body>
</html>
